[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rentready"
version = "0.5.0"
description = "Is your English rental ready for the landlord database (Register your rental property, Renters' Rights Act)? Region window and deadline, gas/EICR/EPC validity, the £65 fee, the upload checklist. Zero dependencies. Also an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "genzagents" }]
keywords = ["landlord", "Renters Rights Act", "PRS database", "Register your rental property", "EICR", "EPC", "gas safety", "MCP"]

[project.urls]
Homepage = "https://genzagents.github.io/rentready/"
Source = "https://github.com/genzagents/rentready"

[project.scripts]
rentready = "rentready:main"

[tool.setuptools]
packages = ["rentready"]
